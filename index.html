<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0F15">
<meta name="robots" content="noindex,nofollow">
<title>Cockpit PEA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0C0F15;--surface:#141922;--line:#252C38;--ink:#E8ECF3;--muted:#8B95A7;--accent:#7590FF;--loss:#F0717A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:22px;margin:14px 0 4px;letter-spacing:-.02em}
p{color:var(--muted);font-size:14px;margin:0 0 18px}
input[type=password]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.04em}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
label.rm{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--muted);margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#0C0F15;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:1.4em;font-size:14px;margin:12px 0 0;color:var(--muted)}
#msg.err{color:var(--loss)}
</style>
</head>
<body>
<main>
  <form class="box" id="f" autocomplete="off">
    <img src="icon-192.png" alt="">
    <h1>Cockpit PEA</h1>
    <p>Tes données sont chiffrées. Entre ton code pour les ouvrir.</p>
    <label for="pw" style="position:absolute;left:-9999px">Code</label>
    <input type="password" id="pw" placeholder="Code" autocomplete="current-password" required>
    <label class="rm"><input type="checkbox" id="rm" checked> Se souvenir sur ce téléphone</label>
    <button id="go">Ouvrir</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const $=id=>document.getElementById(id);
const KEY='cockpit.pw';
function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function put(v){try{v==null?localStorage.removeItem(KEY):localStorage.setItem(KEY,v)}catch(e){}}
async function unlock(pw){
  const res=await fetch('cockpit.enc',{cache:'no-cache'});
  if(!res.ok)throw new Error('net');
  const buf=new Uint8Array(await res.arrayBuffer());
  if(String.fromCharCode(...buf.slice(0,4))!=='CPK1')throw new Error('format');
  const salt=buf.slice(4,20),iv=buf.slice(20,32),data=buf.slice(32);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data)}catch(e){throw new Error('pw')}
  return new TextDecoder().decode(plain);
}
function show(html){document.open();document.write(html);document.close()}
async function attempt(pw,remember){
  $('go').disabled=true;$('msg').className='';$('msg').textContent='Ouverture…';
  try{const html=await unlock(pw);if(remember)put(pw);show(html)}
  catch(e){$('go').disabled=false;
    if(e.message==='pw'){put(null);$('msg').className='err';$('msg').textContent='Code incorrect.'}
    else{$('msg').className='err';$('msg').textContent='Impossible de charger le cockpit. Vérifie ta connexion (la première ouverture doit se faire en ligne).'}}
}
$('f').addEventListener('submit',e=>{e.preventDefault();attempt($('pw').value.trim(),$('rm').checked)});
const saved=get();if(saved)attempt(saved,true);
</script>
</body>
</html>
