name: Widget Windows
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Compilation
        run: dotnet build windows/CockpitWidget/CockpitWidget.csproj -c Release -nologo
      - name: Autotest (déchiffrement + calcul)
        shell: pwsh
        run: |
          $exe = "windows/CockpitWidget/bin/Release/net48/CockpitWidget.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","windows/test/vector.json","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt | ForEach-Object { Write-Output "::notice::$_" }
          if ($p.ExitCode -ne 0) { Write-Output "::error::autotest code $($p.ExitCode)"; exit 1 }
      - name: Capture du widget
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "windows/CockpitWidget/bin/Release/net48/CockpitWidget.exe" -ArgumentList "--render","windows/test/vector.json","windows/preview" -Wait -PassThru
          Get-ChildItem windows/preview | ForEach-Object { Write-Output "::notice::capture $($_.Name) $($_.Length)" }
      - name: Publication
        shell: pwsh
        run: |
          Copy-Item "windows/CockpitWidget/bin/Release/net48/CockpitWidget.exe" "CockpitWidget.exe"
          $n = $env:GITHUB_RUN_NUMBER
          "{""version"": $n}" | Out-File -Encoding utf8 widget-version.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add CockpitWidget.exe widget-version.json windows/preview
          git commit -m "Widget Windows v$n"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: CockpitWidget
          path: CockpitWidget.exe
