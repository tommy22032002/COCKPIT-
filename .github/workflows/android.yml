name: Appli Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilation de l'APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Publication sur GitHub Pages
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cockpit.apk
          cp android/wear/build/outputs/apk/release/wear-release.apk cockpit-wear.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > apk-version.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cockpit.apk cockpit-wear.apk apk-version.json
          git commit -m "APK v1.${GITHUB_RUN_NUMBER}" || echo "rien à publier"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-apk
          path: |
            cockpit.apk
            cockpit-wear.apk
