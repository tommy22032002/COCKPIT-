name: Appli Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilation de l'APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Rotation de clé du téléphone (nouvelle clé secrète, certifiée par l'ancienne)
        # Seule l'appli du téléphone change de clé ; l'appli de la montre reste signée comme avant.
        env:
          PHONE_KS_B64: ${{ secrets.PHONE_KS_B64 }}
          PHONE_KS_PASS: ${{ secrets.PHONE_KS_PASS }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AS="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)apksigner"
          printf '%s' "$PHONE_KS_B64" | base64 -d > "$RUNNER_TEMP/new.keystore"
          OLDPASS="$(grep -oP "storePassword '\K[^']+" android/app/build.gradle)"
          OLD=(--ks android/app/cockpit.keystore --ks-key-alias cockpit --ks-pass "pass:$OLDPASS" --key-pass "pass:$OLDPASS")
          NEW=(--ks "$RUNNER_TEMP/new.keystore" --ks-key-alias capital2026 --ks-pass env:PHONE_KS_PASS --key-pass env:PHONE_KS_PASS)
          "$AS" rotate --out "$RUNNER_TEMP/lineage" --old-signer "${OLD[@]}" --new-signer "${NEW[@]}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$AS" sign "${OLD[@]}" --next-signer "${NEW[@]}" --lineage "$RUNNER_TEMP/lineage" "$APK"
          "$AS" verify --verbose --print-certs "$APK" | grep -E "Verified using|Signer .*certificate SHA-256" || true
          rm -f "$RUNNER_TEMP/new.keystore"
      - name: Publication sur GitHub Pages
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cockpit.apk
          cp android/wear/build/outputs/apk/release/wear-release.apk cockpit-wear.apk
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > apk-version.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cockpit.apk cockpit-wear.apk apk-version.json
          git commit -m "APK v1.${GITHUB_RUN_NUMBER}" || echo "rien à publier"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-apk
          path: |
            cockpit.apk
            cockpit-wear.apk
